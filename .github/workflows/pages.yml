name: Visualizer on GitHub Pages
# The site is built from the spatial branch, which has the Spatial tab, so a push to main doesn't deploy. Running
# this by hand does, and replaces the site with what main has.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10'
    - name: Pin the SDK to .NET 10
      # The runner image also carries a newer SDK (.NET 11), which a plain `dotnet` prefers. Its WebAssembly
      # toolchain builds an app that dies at start-up (SkiaSharp.SKImageInfo), so say which SDK to use and
      # fail here, not in the browser, if it isn't 10. The file only exists for this job.
      run: |
        echo '{ "sdk": { "version": "10.0.100", "rollForward": "latestFeature", "allowPrerelease": false } }' > global.json
        dotnet --version
        dotnet --version | grep -q '^10\.'
    - name: Install WebAssembly workload
      run: dotnet workload install wasm-tools
    - name: Publish
      run: dotnet publish Visualizer.Browser --configuration Release --output publish -p:CompressionEnabled=false
    - name: Publish the single-threaded fallback
      run: |
        dotnet publish Visualizer.Browser --configuration Release --output artifacts/single/publish --artifacts-path artifacts/single -p:WasmEnableThreads=false -p:CompressionEnabled=false
        mkdir -p publish/wwwroot/single
        cp -r artifacts/single/publish/wwwroot/_framework publish/wwwroot/single/_framework
    - name: Upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: publish/wwwroot
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
