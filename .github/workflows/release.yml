name: Visualizer release
# A pushed v* tag builds the desktop Visualizer and attaches it to a draft release, to be checked and
# published by hand. Running it by hand only uploads the zip as a workflow artifact.
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8'
    - name: Publish
      run: dotnet publish Visualizer/Visualizer.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
    - name: Write BUILD.txt
      shell: bash
      run: |
        {
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF_NAME"
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SDK: $(dotnet --version)"
          echo "Runtime: win-x64, self-contained, single file, with PDBs"
        } > publish/BUILD.txt
    - name: Zip
      shell: pwsh
      run: Compress-Archive -Path publish/* -DestinationPath "AlgorithmsVisualizer-$($env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-')-win-x64.zip"
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: visualizer-win-x64
        path: AlgorithmsVisualizer-*-win-x64.zip
        if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Download
      uses: actions/download-artifact@v4
      with:
        name: visualizer-win-x64
    - name: Create the draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" AlgorithmsVisualizer-*-win-x64.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft --generate-notes
