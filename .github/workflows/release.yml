name: Release
# A pushed v* tag builds the desktop Visualizer (Windows and Linux) and the library packages, and attaches them to a draft
# release, to be checked and published by hand. Running it by hand only uploads them as a workflow
# artifact.
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8'
    - name: Choose the version
      shell: bash
      run: |
        # v0.2.0 gives 0.2.0; a run by hand gets a prerelease number.
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-ci.$GITHUB_RUN_NUMBER"; fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "Not a version: $version"; exit 1; fi
        echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
    - name: Publish
      run: dotnet publish Visualizer/Visualizer.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
    - name: Write BUILD.txt
      shell: bash
      run: |
        {
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF_NAME"
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SDK: $(dotnet --version)"
          echo "Runtime: win-x64, self-contained, single file, with PDBs"
        } > publish/BUILD.txt
    - name: Zip
      shell: pwsh
      run: Compress-Archive -Path publish/* -DestinationPath "AlgorithmsVisualizer-$($env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-')-win-x64.zip"
    - name: Pack the libraries
      shell: bash
      run: |
        for project in Algorithms/Algorithms.csproj Collections/Collections.csproj Packables/Packables.csproj Packables.Newtonsoft/Packables.Newtonsoft.csproj; do
          dotnet pack "$project" --configuration Release -p:Version="$PACKAGE_VERSION" --output packages
        done
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: |
          AlgorithmsVisualizer-*-win-x64.zip
          packages/*.nupkg
          packages/*.snupkg
        if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8'
    - name: Publish
      run: dotnet publish Visualizer/Visualizer.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
    - name: Write BUILD.txt
      run: |
        {
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF_NAME"
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SDK: $(dotnet --version)"
          echo "Runtime: linux-x64, self-contained, single file, with PDBs"
        } > publish/BUILD.txt
    - name: Tar
      # A tarball rather than a zip keeps the executable bit.
      run: tar -C publish -czf "AlgorithmsVisualizer-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}-linux-x64.tar.gz" .
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: release-linux
        path: AlgorithmsVisualizer-*-linux-x64.tar.gz
        if-no-files-found: error
  release:
    needs: [build, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Download
      uses: actions/download-artifact@v4
      with:
        pattern: release*
        merge-multiple: true
    - name: Create the draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" AlgorithmsVisualizer-*-win-x64.zip AlgorithmsVisualizer-*-linux-x64.tar.gz packages/*.nupkg packages/*.snupkg --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft --generate-notes
