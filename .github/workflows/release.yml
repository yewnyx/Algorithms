name: Release
# A pushed v* tag builds the desktop Visualizer (Windows and Linux), the library packages and the Unity package, and
# attaches them to a draft release, to be checked and published by hand. A version with a hyphen (v0.2.0-spatial) makes
# the draft a prerelease. Running it by hand only uploads them as a workflow artifact.
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        # 10 is the SDK that builds; 8 stays installed as in ci.yml, though nothing here runs on it.
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Pin the SDK to .NET 10
      # See ci.yml: a plain `dotnet` takes the newest SDK on the image, so say which one to use and fail here if
      # it isn't 10. The file only exists for this job.
      shell: bash
      run: |
        echo '{ "sdk": { "version": "10.0.100", "rollForward": "latestFeature", "allowPrerelease": false } }' > global.json
        dotnet --version
        dotnet --version | grep -q '^10\.'
    - name: Choose the version
      shell: bash
      run: |
        # v0.2.0 gives 0.2.0; a run by hand gets a prerelease number.
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-ci.$GITHUB_RUN_NUMBER"; fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "Not a version: $version"; exit 1; fi
        echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
    - name: Publish
      run: dotnet publish Visualizer/Visualizer.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
    - name: Write BUILD.txt
      shell: bash
      run: |
        {
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF_NAME"
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SDK: $(dotnet --version)"
          echo "Runtime: win-x64, self-contained, single file, with PDBs"
        } > publish/BUILD.txt
    - name: Zip
      shell: pwsh
      run: Compress-Archive -Path publish/* -DestinationPath "AlgorithmsVisualizer-$($env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-')-win-x64.zip"
    - name: Pack the libraries
      shell: bash
      run: |
        for project in Algorithms/Algorithms.csproj Collections/Collections.csproj Packables/Packables.csproj Packables.Newtonsoft/Packables.Newtonsoft.csproj Spatial/Spatial.csproj; do
          dotnet pack "$project" --configuration Release -p:Version="$PACKAGE_VERSION" --output packages
        done
    - name: Pack the Unity package
      # Unity's "Add package from tarball" takes the npm layout: a .tgz with everything under package/. A zip isn't
      # accepted. The version in package.json is the release's, in place of the 0.0.0 that is checked in.
      shell: bash
      run: |
        mkdir -p unity/package
        cp -r Spatial.Unity/. unity/package/
        rm unity/package/.gitignore
        cp LICENSE unity/package/LICENSE
        sed -i "s/^  \"version\": \".*\",\$/  \"version\": \"$PACKAGE_VERSION\",/" unity/package/package.json
        grep -q "^  \"version\": \"$PACKAGE_VERSION\",\$" unity/package/package.json
        tar -C unity -czf "xyz.yewnyx.spatial-$PACKAGE_VERSION.tgz" package
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: |
          AlgorithmsVisualizer-*-win-x64.zip
          xyz.yewnyx.spatial-*.tgz
          packages/*.nupkg
          packages/*.snupkg
        if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        # 10 is the SDK that builds; 8 stays installed as in ci.yml, though nothing here runs on it.
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Pin the SDK to .NET 10
      # See ci.yml.
      run: |
        echo '{ "sdk": { "version": "10.0.100", "rollForward": "latestFeature", "allowPrerelease": false } }' > global.json
        dotnet --version
        dotnet --version | grep -q '^10\.'
    - name: Publish
      run: dotnet publish Visualizer/Visualizer.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
    - name: Write BUILD.txt
      run: |
        {
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF_NAME"
          echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "SDK: $(dotnet --version)"
          echo "Runtime: linux-x64, self-contained, single file, with PDBs"
        } > publish/BUILD.txt
    - name: Tar
      # A tarball rather than a zip keeps the executable bit.
      run: tar -C publish -czf "AlgorithmsVisualizer-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}-linux-x64.tar.gz" .
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: release-linux
        path: AlgorithmsVisualizer-*-linux-x64.tar.gz
        if-no-files-found: error
  release:
    needs: [build, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Download
      uses: actions/download-artifact@v4
      with:
        pattern: release*
        merge-multiple: true
    - name: Create the draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # A hyphen in the version (v0.2.0-spatial) marks a prerelease.
        flags=(--draft --generate-notes)
        if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
        gh release create "$GITHUB_REF_NAME" AlgorithmsVisualizer-*-win-x64.zip AlgorithmsVisualizer-*-linux-x64.tar.gz xyz.yewnyx.spatial-*.tgz packages/*.nupkg packages/*.snupkg --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${flags[@]}"
